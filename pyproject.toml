[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humlit-skills"
version = "1.0.1"
description = "Auditable literature research skills for humanities and social sciences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "ZhuXingcai"},
]
requires-python = ">=3.9"
keywords = ["academic-research", "humanities", "social-science", "agent-skill"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27,<1",
  "selenium>=4.10,<5",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pdfplumber>=0.10,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
humlit = "literature:main"

[project.urls]
Homepage = "https://github.com/ZhuXingcai/HumLit-Skills"
Repository = "https://github.com/ZhuXingcai/HumLit-Skills.git"
Issues = "https://github.com/ZhuXingcai/HumLit-Skills/issues"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["literature"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["cli*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
