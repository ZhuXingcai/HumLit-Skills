name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-dev.lock

      - name: Install HumLit console entry
        run: python -m pip install --no-deps .

      - name: Verify HumLit CLI identity
        run: humlit --version

      - name: Run tests
        run: python -m pytest -q

      - name: Verify release metadata and CLI
        run: python scripts/verify_release.py --version 1.0.1

      - name: Run offline end-to-end smoke
        run: python scripts/smoke_test.py --mode offline
