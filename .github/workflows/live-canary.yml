name: Live API Canary

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-live-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [openalex, semantic, arxiv, nssd, dblp, oa-download, citations]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install runtime dependencies
        run: python -m pip install -r scripts/requirements.lock

      - name: Probe ${{ matrix.source }}
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: >-
          python scripts/smoke_test.py --mode live
          --sources "${{ matrix.source }}"
          | tee "live-${{ matrix.source }}.json"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.source }}
          path: live-${{ matrix.source }}.json
          if-no-files-found: warn
