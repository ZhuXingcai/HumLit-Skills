name: Platform Adversarial

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/platform-adversarial.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/test_platform_adversarial.py"
  pull_request:
    paths:
      - ".github/workflows/platform-adversarial.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/test_platform_adversarial.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-runtime:
    name: hostile runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.lock

      - name: Install locked test dependencies
        run: python -m pip install -r scripts/requirements-dev.lock

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .

      - name: Install built wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('wheelhouse').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])"

      - name: Record platform
        run: >-
          python -c "import json, locale, platform, sys;
          print(json.dumps({
          'platform': platform.platform(),
          'machine': platform.machine(),
          'python': sys.version,
          'filesystem_encoding': sys.getfilesystemencoding(),
          'preferred_encoding': locale.getpreferredencoding(False)
          }, indent=2))"

      - name: Run adversarial platform tests
        env:
          HUMLIT_ADVERSARIAL_REQUIRE_INSTALLED: "1"
        run: >-
          python -m pytest -q tests/test_platform_adversarial.py
          --junitxml=platform-adversarial-${{ runner.os }}.xml
